<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
    System Message | CropAI
</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet">

<style>

:root{
    --bg-0:#0a1410;
    --bg-1:#102a1f;

    --green:#52b788;
    --green-2:#2d6a4f;

    --text:#e8f3ee;
    --muted:#9bb0a6;

    --border:rgba(255,255,255,.08);
    --glass:rgba(255,255,255,.04);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    font-family:'Inter',sans-serif;

    background:
    radial-gradient(
        1200px 800px
        at 10% 0%,
        var(--bg-1) 0%,
        var(--bg-0) 55%
    );

    display:flex;
    justify-content:center;
    align-items:center;

    color:var(--text);
    overflow:hidden;
}

/* Background Orbs */

.bg-orbs{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
}

.orb-1{
    width:350px;
    height:350px;
    background:var(--green);

    top:-100px;
    left:-80px;

    opacity:.25;
}

.orb-2{
    width:250px;
    height:250px;
    background:#74c69d;

    bottom:-80px;
    right:10%;

    opacity:.2;
}

/* Card */

.message-card{
    width:min(550px,90%);

    background:var(--glass);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid var(--border);

    border-radius:24px;

    padding:40px;

    text-align:center;

    box-shadow:
    0 20px 50px rgba(0,0,0,.35);

    position:relative;
    z-index:5;
}

.icon{
    width:90px;
    height:90px;

    margin:0 auto 20px;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        rgba(82,183,136,.25),
        rgba(45,106,79,.25)
    );

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:40px;
}

h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:28px;
    margin-bottom:12px;
}

.message{
    color:var(--muted);

    line-height:1.7;

    font-size:15px;

    margin-bottom:28px;
}

.actions{
    display:flex;
    justify-content:center;
    gap:12px;
}

/* Buttons */

.btn{
    text-decoration:none;

    padding:12px 22px;

    border-radius:12px;

    font-weight:600;

    transition:.25s ease;
}

.btn-primary{
    background:
    linear-gradient(
        135deg,
        var(--green),
        var(--green-2)
    );

    color:white;
}

.btn-primary:hover{
    transform:translateY(-2px);
}

.btn-secondary{
    background:transparent;

    color:var(--text);

    border:1px solid var(--border);

    cursor:pointer;
}

.btn-secondary:hover{
    border-color:var(--green);
    background:rgba(82,183,136,.08);
}

@media(max-width:600px){

    .message-card{
        padding:30px 20px;
    }

    .actions{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}

</style>

</head>

<body>

<div class="bg-orbs">

    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>

</div>

<div class="message-card">

    <div class="icon">
        ⚠️
    </div>

    <h1>
        {{ error_title }}
    </h1>

    <p class="message">
        {{ error_message }}
    </p>

    <div class="actions">

    <a href="{{ url_for('main.landing') }}"
       class="btn btn-primary">

        Back Home

    </a>

    <button
        onclick="location.href=document.referrer || '/'"
        class="btn btn-secondary">

        Go Back

    </button>

</div>

</div>

</body>
</html>
